services:
  mysql:
    container_name: adm_videos_mysql
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: adm_videos
    ports:
      - "3306:3306"
    volumes:
      - adm_videos_mysql_data:/var/lib/mysql
    networks:
      - adm_videos_network

volumes:
  adm_videos_mysql_data:

networks:
  adm_videos_network:
    name: adm_videos_network
