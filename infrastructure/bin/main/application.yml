server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: admin-do-catalogo-gatoflix
  flyway:
    baseline-on-migrate: true
  datasource:
    hikari:
      auto-commit: false
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:300000}
      pool-name: ${HIKARI_POOL_NAME:gatoflix-adm-videos-hikari-pool}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        check_nullability: true
        connection.provider_disables_autocommit: true
        jdbc.batch_size: 50
        jdbc.fetch_size: 50
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        query.in_clause_parameter_padding: true
        query.plan_cache_max_size: 2048
        query.fail_on_pagination_over_collection_fetch: true
        generate_statistics: false
